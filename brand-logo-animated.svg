<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 520" role="img" aria-labelledby="t d">
<title id="t">Manjeet Digital Hub</title><desc id="d">Animated blue and gold ring logo</desc>
<defs>
 <radialGradient id="bg"><stop stop-color="#071a3d"/><stop offset="1" stop-color="#020817"/></radialGradient>
 <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#00d9ff"/><stop offset=".35" stop-color="#176bff"/><stop offset=".62" stop-color="#ff31d2"/><stop offset=".82" stop-color="#ff9b00"/><stop offset="1" stop-color="#ffe36b"/></linearGradient>
 <linearGradient id="hub"><stop stop-color="#2ddcff"/><stop offset="1" stop-color="#1888ff"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="520" height="520" rx="70" fill="url(#bg)"/>
<circle cx="260" cy="260" r="216" fill="none" stroke="url(#ring)" stroke-width="7" opacity=".45" filter="url(#glow)"/>
<circle cx="260" cy="260" r="216" fill="none" stroke="url(#ring)" stroke-width="5" stroke-linecap="round" stroke-dasharray="250 80 120 70" filter="url(#glow)"><animateTransform attributeName="transform" type="rotate" from="0 260 260" to="360 260 260" dur="7s" repeatCount="indefinite"/></circle>
<circle cx="260" cy="260" r="205" fill="none" stroke="url(#ring)" stroke-width="2" stroke-dasharray="55 34" opacity=".85"><animateTransform attributeName="transform" type="rotate" from="360 260 260" to="0 260 260" dur="11s" repeatCount="indefinite"/></circle>
<g filter="url(#glow)"><circle r="7" fill="#56e8ff"><animateMotion dur="4.5s" repeatCount="indefinite" path="M260,44 A216,216 0 1,1 259.9,44"/></circle><circle r="6" fill="#ffc62d"><animateMotion dur="5.8s" repeatCount="indefinite" path="M260,476 A216,216 0 1,0 260.1,476"/></circle></g>
<g transform="translate(320 118)"><rect width="24" height="24" rx="4" fill="#16b7ff"/><rect x="30" y="-18" width="35" height="35" rx="5" fill="#ff9f0a"/><rect x="30" y="24" width="28" height="28" rx="5" fill="#32d16d"/><rect x="-18" y="30" width="20" height="20" rx="4" fill="#165dff"/></g>
<text x="260" y="260" fill="white" font-family="Arial,sans-serif" font-size="67" font-weight="800" text-anchor="middle">Manjeet</text>
<text x="220" y="320" fill="white" font-family="Arial,sans-serif" font-size="47" font-weight="400" text-anchor="middle">Digital</text><text x="372" y="320" fill="url(#hub)" font-family="Arial,sans-serif" font-size="47" font-weight="700" text-anchor="middle">Hub</text>
<rect x="145" y="343" width="230" height="2" rx="1" fill="url(#ring)"/>
<g fill="#fff" font-family="Arial,sans-serif" font-size="14" letter-spacing="5" text-anchor="middle"><text x="260" y="377">SIMPLE TOOLS</text><text x="260" y="405">SMART SOLUTIONS</text><text x="260" y="433">BETTER LIFE</text></g>
</svg>