<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Age Calculator - Manjeet Digital Hub</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fc;color:#172033;font-family:Arial,sans-serif}.w{max-width:850px;margin:auto;padding:14px}.back{color:#2563eb;text-decoration:none;font-weight:bold}.card{background:#fff;border:1px solid #e2e8f0;border-radius:20px;padding:18px;margin-top:12px;box-shadow:0 10px 30px #2563eb12}h1{margin:0;font-size:25px}.sub{color:#64748b;font-size:12px;margin:6px 0 17px}.tabs{display:flex;gap:6px;background:#eef2f7;padding:5px;border-radius:12px;margin-bottom:14px}.tabs button{flex:1;border:0;padding:10px;border-radius:9px;font-weight:bold;background:transparent;color:#64748b}.tabs .on{background:#2563eb;color:#fff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.f label{display:block;font-size:11px;font-weight:bold;color:#475569;margin-bottom:5px}.f input,.f select{width:100%;padding:12px;border:1px solid #dbe3ef;border-radius:10px;font-size:14px;background:#fff}.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.btn{border:0;border-radius:10px;padding:11px 14px;font-weight:bold;background:#edf4ff;color:#1d4ed8}.primary{background:#2563eb;color:#fff}.results{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:17px}.stat{padding:14px;text-align:center;background:#f8fbff;border:1px solid #dbeafe;border-radius:13px}.stat small{display:block;color:#64748b;font-size:10px;margin-bottom:6px}.stat strong{font-size:19px}.main{background:linear-gradient(135deg,#2563eb,#4f46e5)}.main small,.main strong{color:#fff}.sum{margin-top:14px;padding:12px;background:#f8fafc;border-radius:11px;font-size:12px;line-height:1.6}.note{font-size:10px;color:#64748b;margin-top:10px;line-height:1.5}@media(max-width:600px){.grid,.results{grid-template-columns:1fr}.w{padding:9px}}@media print{.no-print{display:none!important}.card{box-shadow:none;border:0}body{background:#fff}}</style></head><body><div class="w"><a class="back no-print" href="../index.html">← Back to Manjeet Digital Hub</a><div class="card"><h1>🎂 Age Calculator</h1><div class="sub">Calculate exact age from date of birth to any selected date.</div><div class="grid"><div class="f"><label>Date of Birth</label><input id="dob" type="date"></div><div class="f"><label>Age On Date</label><input id="on" type="date"></div></div><div class="btns no-print"><button class="btn primary" onclick="calc()">Calculate Age</button><button class="btn" onclick="printPage()">🖨 Print / Save PDF</button></div><div class="results"><div class="stat main"><small>YEARS</small><strong id="years">0</strong></div><div class="stat"><small>MONTHS</small><strong id="months">0</strong></div><div class="stat"><small>DAYS</small><strong id="days">0</strong></div></div><div class="sum" id="sum">Select date of birth to calculate exact age.</div></div></div><script>var $=function(x){return document.getElementById(x)},money=function(n){return"₹"+Math.round(n||0).toLocaleString("en-IN")};function printPage(){window.print()}function parse(v){var a=v.split("-");return new Date(+a[0],+a[1]-1,+a[2])}function calc(){if(!$("dob").value||!$("on").value)return;var d=parse($("dob").value),e=parse($("on").value);if(d>e){$("sum").textContent="Date of birth cannot be after calculation date.";return}var y=e.getFullYear()-d.getFullYear(),m=e.getMonth()-d.getMonth(),day=e.getDate()-d.getDate();if(day<0){m--;day+=new Date(e.getFullYear(),e.getMonth(),0).getDate()}if(m<0){y--;m+=12}$("years").textContent=y;$("months").textContent=m;$("days").textContent=day;var diff=Math.floor((e-d)/86400000);$("sum").innerHTML="Exact age: <b>"+y+" years, "+m+" months, "+day+" days</b> • Total days: <b>"+diff.toLocaleString("en-IN")+"</b>."}var now=new Date(),iso=now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0")+"-"+String(now.getDate()).padStart(2,"0");$("on").value=iso;$("dob").onchange=calc;$("on").onchange=calc;</script></body></html>
