<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JPG to PDF - Manjeet Digital Hub</title><script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#0f172a}.top{background:#fff;border-bottom:1px solid #ddd;padding:12px;display:flex;gap:10px;align-items:center}.top button{border:0;background:#eef4ff;color:#1d4ed8;padding:9px 12px;border-radius:9px;font-weight:700}.wrap{max-width:760px;margin:auto;padding:14px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:14px;margin-bottom:12px}.upload{display:block;border:2px dashed #93c5fd;background:#f8fbff;border-radius:14px;text-align:center;padding:24px 10px;cursor:pointer}.upload input{display:none}.upload b,.upload small{display:block;margin-top:6px}.upload small,.sub{color:#64748b;font-size:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.field label{font-size:11px;font-weight:700;display:block;margin-bottom:5px}.field select{width:100%;padding:10px;border:1px solid #dbe3ef;border-radius:9px;background:#fff}#list{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}.item{border:1px solid #e2e8f0;border-radius:11px;padding:7px}.item img{width:100%;height:120px;object-fit:contain;background:#f8fafc;border-radius:7px}.name{font-size:10px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.acts{display:flex;gap:4px;margin-top:5px}.acts button{flex:1;border:0;padding:7px;border-radius:6px;background:#eef4ff;color:#1d4ed8}.acts .del{background:#fff1f2;color:#be123c}.primary{width:100%;margin-top:12px;border:0;border-radius:10px;padding:12px;background:#2563eb;color:white;font-weight:800}.primary:disabled{opacity:.5}.note,.status{font-size:11px;color:#64748b;margin-top:9px}.count{font-size:11px;color:#2563eb;font-weight:700;margin-top:9px}
</style></head><body><header class="top"><button onclick="history.back()">← Back</button><b>🖼️ JPG → PDF</b></header><main class="wrap"><div class="card"><h2>JPG to PDF</h2><p class="sub">Combine one or more JPG/JPEG photos into one PDF.</p><label class="upload"><input id="files" type="file" accept="image/jpeg,.jpg,.jpeg" multiple><span style="font-size:30px">📁</span><b>Choose JPG Photos</b><small>Select one or multiple images</small></label><div id="count" class="count"></div><div id="list"></div></div><div class="card"><div class="grid"><div class="field"><label>Page Size</label><select id="size"><option value="a4">A4</option><option value="fit">Fit to Image</option></select></div><div class="field"><label>Orientation</label><select id="ori"><option value="auto">Auto</option><option value="portrait">Portrait</option><option value="landscape">Landscape</option></select></div><div class="field"><label>Margin</label><select id="margin"><option value="0">None</option><option value="10" selected>Small</option><option value="20">Large</option></select></div><div class="field"><label>Quality</label><select id="quality"><option value=".65">Smaller PDF</option><option value=".82" selected>Balanced</option><option value=".95">High</option></select></div></div><button id="make" class="primary" disabled>Create & Download PDF</button><div id="status" class="status"></div><div class="note">🔒 Images are processed in your browser.</div></div></main><script>
const F=document.getElementById('files'),L=document.getElementById('list'),C=document.getElementById('count'),B=document.getElementById('make'),S=document.getElementById('status');let A=[];
function data(f){return new Promise((r,j)=>{let x=new FileReader;x.onload=()=>r(x.result);x.onerror=j;x.readAsDataURL(f)})}function dim(s){return new Promise((r,j)=>{let i=new Image;i.onload=()=>r([i.naturalWidth,i.naturalHeight]);i.onerror=j;i.src=s})}
F.onchange=async()=>{for(const f of [...F.files])A.push({f,src:await data(f)});F.value='';render()};
function render(){L.innerHTML='';C.textContent=A.length?A.length+' photo(s) selected':'';B.disabled=!A.length;A.forEach((x,i)=>{let d=document.createElement('div');d.className='item';d.innerHTML='<img><div class="name"></div><div class="acts"><button class="u">←</button><button class="d">→</button><button class="del">✕</button></div>';d.querySelector('img').src=x.src;d.querySelector('.name').textContent=x.f.name;d.querySelector('.u').onclick=()=>{if(i){[A[i-1],A[i]]=[A[i],A[i-1]];render()}};d.querySelector('.d').onclick=()=>{if(i<A.length-1){[A[i+1],A[i]]=[A[i],A[i+1]];render()}};d.querySelector('.del').onclick=()=>{A.splice(i,1);render()};L.appendChild(d)})}
B.onclick=async()=>{if(!A.length)return;B.disabled=true;try{const {jsPDF}=window.jspdf;let p=null;for(let n=0;n<A.length;n++){let [iw,ih]=await dim(A[n].src),o=document.getElementById('ori').value;if(o==='auto')o=iw>=ih?'landscape':'portrait';let fmt=document.getElementById('size').value==='fit'?[iw*.75,ih*.75]:'a4';if(!p)p=new jsPDF({orientation:o,unit:'pt',format:fmt});else p.addPage(fmt,o);let pw=p.internal.pageSize.getWidth(),ph=p.internal.pageSize.getHeight(),m=+document.getElementById('margin').value,sc=Math.min((pw-2*m)/iw,(ph-2*m)/ih),w=iw*sc,h=ih*sc;p.addImage(A[n].src,'JPEG',(pw-w)/2,(ph-h)/2,w,h,undefined,'FAST');S.textContent='Processing '+(n+1)+'/'+A.length}p.save('manjeet-jpg-to-pdf.pdf');S.textContent='✓ PDF downloaded.'}catch(e){S.textContent='Unable to create PDF. Try again.'}B.disabled=!A.length};
</script></body></html>
