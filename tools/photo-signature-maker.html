<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f8ff;color:#172033;font-family:Arial,sans-serif}.wrap{max-width:980px;margin:auto;padding:12px}.back{color:#2563eb;font-weight:700;text-decoration:none}.card{background:#fff;border:1px solid #e2e8f0;border-radius:18px;padding:14px;margin-top:10px;box-shadow:0 8px 24px #2563eb12}h1{font-size:22px;margin:0 0 5px}.sub{font-size:12px;color:#64748b}.grid{display:grid;grid-template-columns:1fr;gap:12px}.box{border:1px solid #e2e8f0;border-radius:13px;padding:10px;background:#fbfdff}.box h3{font-size:14px;margin:0 0 8px}.upload{display:block;text-align:center;border:2px dashed #9ab7ff;border-radius:11px;padding:12px;cursor:pointer;background:#f8fbff;font-weight:700;font-size:12px}.upload input{display:none}.row{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0}.btn{border:0;border-radius:9px;padding:9px 10px;font-size:11px;font-weight:700;background:#edf4ff;color:#1d4ed8;cursor:pointer}.btn.primary{background:#2563eb;color:#fff}.btn.danger{background:#fff1f2;color:#be123c}.btn:disabled{opacity:.45}.field{margin:7px 0}.field label{display:block;font-size:10px;font-weight:700;color:#475569;margin-bottom:4px}.field input,.field select{width:100%;padding:8px;border:1px solid #dbe3ef;border-radius:8px;background:#fff}.two{display:grid;grid-template-columns:1fr 1fr;gap:7px}.croparea{height:300px;background:#111;border-radius:10px;overflow:hidden;display:none}.croparea img{max-width:100%}.previewWrap{background:#e8edf7;border-radius:12px;padding:12px;overflow:auto}.output{position:relative;margin:auto;background:#fff;box-shadow:0 3px 15px #0002;overflow:hidden;touch-action:none}.photoLayer,.nameLayer,.signLayer{position:absolute;touch-action:none;user-select:none}.photoLayer img,.signLayer img{width:100%;height:100%;display:block;object-fit:contain;pointer-events:none}.photoLayer img{object-fit:cover}.photoLayer{box-shadow:0 0 0 1px #94a3b8}.nameLayer{display:flex;align-items:center;justify-content:center;text-align:center;font-weight:700;white-space:nowrap}.selected{outline:2px dashed #2563eb;outline-offset:2px}.handle{display:none;position:absolute;right:2px;bottom:2px;width:24px;height:24px;border-radius:50%;background:#2563eb;border:3px solid #fff;box-shadow:0 1px 5px #0005;z-index:20;cursor:nwse-resize;touch-action:none}.selected .handle{display:block}.checker{background:repeating-conic-gradient(#eee 0 25%,#fff 0 50%) 0/16px 16px}.sigClean{display:none;margin-top:8px}.sigClean canvas{max-width:100%;max-height:150px;border:1px solid #ddd;border-radius:8px}.status{text-align:center;color:#64748b;font-size:11px;margin:8px}.note{font-size:10px;color:#64748b;background:#f8fafc;padding:9px;border-radius:9px}.range{width:100%}.finalPhotoMode>h3,.finalPhotoMode>.upload,.finalPhotoMode>#cropArea,.finalPhotoMode>.row{display:none!important}.finalPhotoMode>#postPhotoOptions{display:block!important}
@media(max-width:720px){.croparea{height:270px}}
</style></head><body>
<div class="wrap"><a href="../index.html" class="back">← Back</a><div class="card">
<h1>📸 Photo + Signature Maker</h1><p class="sub">Select a photo to start.</p>
<div id="livePreview" style="display:none"><div class="box"><h3>Live Preview</h3><div class="previewWrap"><div id="output" class="output"><div id="photoLayer" class="photoLayer"><img id="photoFinal"><span class="handle"></span></div><div id="nameLayer" class="nameLayer">Your Name<span class="handle"></span></div><div id="signLayer" class="signLayer" style="display:none"><img id="signFinal"><span class="handle"></span></div></div></div><div class="status" id="status">Upload a photo to begin.</div></div></div>
<div class="grid"><div><div class="box" id="photoStep"><h3>Photo</h3><label class="upload">📷 Upload Photo<input id="photoInput" type="file" accept="image/*"></label><div id="cropArea" class="croparea"><img id="cropImg"></div><div class="row"><select id="ratio" class="btn"><option value="free">Free Crop</option><option value="35/45">3.5 × 4.5</option><option value="1">Square</option><option value="3/4">3:4</option></select><button id="applyCrop" class="btn primary" disabled>✂️ Apply Crop</button><button id="zoomPlus" class="btn" disabled>＋ Zoom</button><button id="zoomMinus" class="btn" disabled>− Zoom</button></div>
<div id="postPhotoOptions" class="box" style="display:none;margin-top:10px"><h3>Photo Border</h3><div class="two"><div class="field"><label>Border Size: <span id="borderV">0</span> px</label><input id="photoBorder" class="range" type="range" min="0" max="40" value="0"></div><div class="field"><label>Border Color</label><input id="borderColor" type="color" value="#ffffff"></div></div><div class="row"><button type="button" class="btn" data-border="0">No Border</button><button type="button" class="btn" data-border="3">Thin</button><button type="button" class="btn" data-border="7">Medium</button><button type="button" class="btn" data-border="12">Thick</button></div><select id="photoBg" style="display:none"><option value="#ffffff" selected>White</option></select></div></div>
<div class="box" id="nameStep" style="display:none"><h3>Name</h3><div class="field"><label>Name</label><input id="nameText" value="Your Name"></div><div class="two"><div class="field"><label>Font</label><select id="nameFont"><option>Arial</option><option>Georgia</option><option>Times New Roman</option><option>Verdana</option></select></div><div class="field"><label>Size</label><input id="nameSize" type="number" min="10" max="60" value="24"></div></div></div>
<div class="box" id="signatureStep" style="display:none"><h3>Signature</h3><label class="upload">✍️ Upload Signature<input id="sigInput" type="file" accept="image/*"></label><div id="sigClean" class="sigClean checker"><canvas id="sigCanvas"></canvas></div><div class="field"><label>Background Removal / Threshold: <span id="tv">175</span></label><input id="threshold" class="range" type="range" min="60" max="245" value="175"></div><div class="field"><label>Ink Color</label><select id="ink"><option value="#111111">Black</option><option value="#123a8c">Blue</option><option value="#0b2f70">Dark Blue</option></select></div><button id="useSig" class="btn primary" disabled>✓ Use Transparent Signature</button></div>
<div class="box" id="outputStep" style="display:none"><h3>Download</h3><div class="two"><div class="field"><label>Width (px)</label><input id="outW" type="number" value="600"></div><div class="field"><label>Height (px)</label><input id="outH" type="number" value="800"></div></div><div class="two"><div class="field"><label>Format</label><select id="format"><option value="jpeg">JPG</option><option value="png">PNG</option></select></div><div class="field"><label>JPG Quality</label><input id="quality" type="number" value="92"></div></div><div class="row"><button id="download" class="btn primary">⬇ Download Final</button><button id="reset" class="btn danger">Reset</button></div></div></div></div></div></div>
<script>
var $=function(id){return document.getElementById(id)},cropper=null,sigOriginal=null,output=$("output"),photoLayer=$("photoLayer"),nameLayer=$("nameLayer"),signLayer=$("signLayer"),photoFinal=$("photoFinal"),signFinal=$("signFinal"),status=$("status");
function layout(){var w=Math.min(430,window.innerWidth-70),h=w*4/3;output.style.width=w+"px";output.style.height=h+"px";if(!photoLayer.dataset.ready){setBox(photoLayer,.08,.05,.84,.68);setBox(nameLayer,.12,.75,.76,.08);setBox(signLayer,.22,.84,.56,.10);photoLayer.dataset.ready="1"}}
function setBox(el,x,y,w,h){el.dataset.x=x;el.dataset.y=y;el.dataset.w=w;el.dataset.h=h;paintBox(el)}
function paintBox(el){el.style.left=(+el.dataset.x*100)+"%";el.style.top=(+el.dataset.y*100)+"%";el.style.width=(+el.dataset.w*100)+"%";el.style.height=(+el.dataset.h*100)+"%"}
function point(e){var t=(e.touches&&e.touches[0])||(e.changedTouches&&e.changedTouches[0]);return t?{x:t.clientX,y:t.clientY}:{x:e.clientX,y:e.clientY}}
function select(el){[photoLayer,nameLayer,signLayer].forEach(function(x){x.classList.remove("selected")});el.classList.add("selected")}
function makeInteractive(el){function moveStart(e){if(e.target.classList.contains("handle"))return;e.stopPropagation();if(e.cancelable)e.preventDefault();select(el);var p=point(e),sx=p.x,sy=p.y,ox=+el.dataset.x,oy=+el.dataset.y;function mv(q){if(q.cancelable)q.preventDefault();var z=point(q);el.dataset.x=Math.max(0,Math.min(1-(+el.dataset.w),ox+(z.x-sx)/output.clientWidth));el.dataset.y=Math.max(0,Math.min(1-(+el.dataset.h),oy+(z.y-sy)/output.clientHeight));paintBox(el)}function up(){document.removeEventListener("mousemove",mv);document.removeEventListener("mouseup",up);document.removeEventListener("touchmove",mv);document.removeEventListener("touchend",up)}document.addEventListener("mousemove",mv);document.addEventListener("mouseup",up);document.addEventListener("touchmove",mv,{passive:false});document.addEventListener("touchend",up)}el.addEventListener("mousedown",moveStart);el.addEventListener("touchstart",moveStart,{passive:false});var h=el.querySelector(".handle");function resizeStart(e){e.stopPropagation();if(e.cancelable)e.preventDefault();select(el);var p=point(e),sx=p.x,sy=p.y,ow=+el.dataset.w,oh=+el.dataset.h;function mv(q){if(q.cancelable)q.preventDefault();var z=point(q);el.dataset.w=Math.max(.08,Math.min(1-(+el.dataset.x),ow+(z.x-sx)/output.clientWidth));el.dataset.h=Math.max(.035,Math.min(1-(+el.dataset.y),oh+(z.y-sy)/output.clientHeight));paintBox(el)}function up(){document.removeEventListener("mousemove",mv);document.removeEventListener("mouseup",up);document.removeEventListener("touchmove",mv);document.removeEventListener("touchend",up)}document.addEventListener("mousemove",mv);document.addEventListener("mouseup",up);document.addEventListener("touchmove",mv,{passive:false});document.addEventListener("touchend",up)}h.addEventListener("mousedown",resizeStart);h.addEventListener("touchstart",resizeStart,{passive:false})}
[photoLayer,nameLayer,signLayer].forEach(makeInteractive);
$("photoInput").onchange=function(e){var f=e.target.files[0];if(!f)return;var u=URL.createObjectURL(f),im=$("cropImg");im.onload=function(){if(cropper)cropper.destroy();$("cropArea").style.display="block";cropper=new Cropper(im,{viewMode:1,dragMode:"move",autoCropArea:.9,background:false,responsive:true,aspectRatio:NaN,cropBoxMovable:true,cropBoxResizable:true});$("applyCrop").disabled=false;$("zoomPlus").disabled=false;$("zoomMinus").disabled=false};im.src=u};
$("ratio").onchange=function(){if(!cropper)return;var v=this.value;cropper.setAspectRatio(v==="free"?NaN:(v==="35/45"?35/45:Number(v)))};$("zoomPlus").onclick=function(){if(cropper)cropper.zoom(.1)};$("zoomMinus").onclick=function(){if(cropper)cropper.zoom(-.1)};
$("applyCrop").onclick=function(){if(!cropper)return;photoFinal.src=cropper.getCroppedCanvas({maxWidth:1600,maxHeight:2000}).toDataURL("image/jpeg",.95);cropper.destroy();cropper=null;$("photoStep").classList.add("finalPhotoMode");$("livePreview").style.display="block";$("postPhotoOptions").style.display="block";$("nameStep").style.display="block";$("signatureStep").style.display="block";$("outputStep").style.display="block";updateBorder();select(photoLayer)};
$("nameText").oninput=function(){nameLayer.childNodes[0].nodeValue=this.value||" "};function nameStyle(){nameLayer.style.fontFamily=$("nameFont").value;nameLayer.style.fontSize=$("nameSize").value+"px"};$("nameFont").onchange=nameStyle;$("nameSize").oninput=nameStyle;
function updateBorder(){var b=Math.max(0,+$("photoBorder").value||0);photoLayer.style.border=b+"px solid "+$("borderColor").value;$("borderV").textContent=b}$("photoBorder").oninput=updateBorder;$("borderColor").oninput=updateBorder;Array.prototype.forEach.call(document.querySelectorAll("[data-border]"),function(btn){btn.onclick=function(){$("photoBorder").value=this.getAttribute("data-border");updateBorder()}});
function loadImg(f){return new Promise(function(res,rej){var u=URL.createObjectURL(f),im=new Image();im.onload=function(){URL.revokeObjectURL(u);res(im)};im.onerror=rej;im.src=u})}
$("sigInput").onchange=async function(e){var f=e.target.files[0];if(!f)return,im=await loadImg(f);sigOriginal=document.createElement("canvas");sigOriginal.width=im.naturalWidth;sigOriginal.height=im.naturalHeight;sigOriginal.getContext("2d").drawImage(im,0,0);$("sigClean").style.display="block";renderSig();$("useSig").disabled=false};
function rgb(h){return[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]}
function renderSig(){if(!sigOriginal)return;var W=sigOriginal.width,H=sigOriginal.height,src=sigOriginal.getContext("2d").getImageData(0,0,W,H),d=src.data,T=+$("threshold").value,col=rgb($("ink").value),c=$("sigCanvas");c.width=W;c.height=H;var x=c.getContext("2d"),o=x.createImageData(W,H);for(var i=0;i<W*H;i++){var lum=.299*d[i*4]+.587*d[i*4+1]+.114*d[i*4+2],on=lum<T;o.data[i*4]=on?col[0]:255;o.data[i*4+1]=on?col[1]:255;o.data[i*4+2]=on?col[2]:255;o.data[i*4+3]=on?255:0}x.putImageData(o,0,0);$("tv").textContent=T}$("threshold").oninput=renderSig;$("ink").onchange=renderSig;
$("useSig").onclick=function(){signFinal.src=$("sigCanvas").toDataURL("image/png");signLayer.style.display="block";select(signLayer);status.textContent="Signature selected — drag to move and use blue corner to resize."};
$("download").onclick=function(){if(!photoFinal.src)return alert("Please upload and crop a photo first.");var W=+$("outW").value||600,H=+$("outH").value||800,c=document.createElement("canvas");c.width=W;c.height=H;var x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,W,H);var p=photoLayer,X=+p.dataset.x*W,Y=+p.dataset.y*H,PW=+p.dataset.w*W,PH=+p.dataset.h*H,b=Math.max(0,+$("photoBorder").value||0)*(W/output.clientWidth);if(b){x.fillStyle=$("borderColor").value;x.fillRect(X,Y,PW,PH);x.drawImage(photoFinal,X+b,Y+b,Math.max(1,PW-2*b),Math.max(1,PH-2*b))}else x.drawImage(photoFinal,X,Y,PW,PH);x.fillStyle="#111";x.textAlign="center";x.textBaseline="middle";x.font="700 "+Math.max(10,+$("nameSize").value*(W/output.clientWidth))+'px "'+$("nameFont").value+'"';var n=nameLayer;x.fillText($("nameText").value||"",(+n.dataset.x+(+n.dataset.w)/2)*W,(+n.dataset.y+(+n.dataset.h)/2)*H);if(signLayer.style.display!=="none"&&signFinal.src){var q=signLayer;x.drawImage(signFinal,+q.dataset.x*W,+q.dataset.y*H,+q.dataset.w*W,+q.dataset.h*H)}var fmt=$("format").value,mime=fmt==="png"?"image/png":"image/jpeg",ext=fmt==="png"?"png":"jpg";c.toBlob(function(blob){var u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download="photo-name-signature."+ext;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},5000)},mime,(+$("quality").value||92)/100)};
$("reset").onclick=function(){location.reload()};layout();nameStyle();window.addEventListener("resize",layout);
</script></body></html>
