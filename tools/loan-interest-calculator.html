<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Loan Interest Calculator - Manjeet Digital Hub</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fc;color:#172033;font-family:Arial,sans-serif}.w{max-width:850px;margin:auto;padding:14px}.back{color:#2563eb;text-decoration:none;font-weight:bold}.card{background:#fff;border:1px solid #e2e8f0;border-radius:20px;padding:18px;margin-top:12px;box-shadow:0 10px 30px #2563eb12}h1{margin:0;font-size:25px}.sub{color:#64748b;font-size:12px;margin:6px 0 17px}.tabs{display:flex;gap:6px;background:#eef2f7;padding:5px;border-radius:12px;margin-bottom:14px}.tabs button{flex:1;border:0;padding:10px;border-radius:9px;font-weight:bold;background:transparent;color:#64748b}.tabs .on{background:#2563eb;color:#fff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.f label{display:block;font-size:11px;font-weight:bold;color:#475569;margin-bottom:5px}.f input,.f select{width:100%;padding:12px;border:1px solid #dbe3ef;border-radius:10px;font-size:14px;background:#fff}.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.btn{border:0;border-radius:10px;padding:11px 14px;font-weight:bold;background:#edf4ff;color:#1d4ed8}.primary{background:#2563eb;color:#fff}.results{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:17px}.stat{padding:14px;text-align:center;background:#f8fbff;border:1px solid #dbeafe;border-radius:13px}.stat small{display:block;color:#64748b;font-size:10px;margin-bottom:6px}.stat strong{font-size:19px}.main{background:linear-gradient(135deg,#2563eb,#4f46e5)}.main small,.main strong{color:#fff}.sum{margin-top:14px;padding:12px;background:#f8fafc;border-radius:11px;font-size:12px;line-height:1.6}.note{font-size:10px;color:#64748b;margin-top:10px;line-height:1.5}@media(max-width:600px){.grid,.results{grid-template-columns:1fr}.w{padding:9px}}@media print{.no-print{display:none!important}.card{box-shadow:none;border:0}body{background:#fff}}</style></head><body><div class="w"><a class="back no-print" href="../index.html">← Back to Manjeet Digital Hub</a><div class="card"><h1>💰 Loan Interest Calculator</h1><div class="sub">Calculate EMI, total loan interest and repayment amount.</div><div class="grid"><div class="f"><label>Loan Amount (₹)</label><input id="amt" type="number" value="500000"></div><div class="f"><label>Annual Interest Rate (%)</label><input id="rate" type="number" step=".01" value="10"></div><div class="f"><label>Tenure</label><input id="time" type="number" value="5"></div><div class="f"><label>Tenure Type</label><select id="unit"><option value="y">Years</option><option value="m">Months</option></select></div></div><div class="btns no-print"><button class="btn primary" onclick="calc()">Calculate</button><button class="btn" onclick="printPage()">🖨 Print / Save PDF</button></div><div class="results"><div class="stat main"><small>MONTHLY EMI</small><strong id="emi">₹0</strong></div><div class="stat"><small>TOTAL INTEREST</small><strong id="interest">₹0</strong></div><div class="stat"><small>TOTAL PAYMENT</small><strong id="total">₹0</strong></div></div><div class="sum" id="sum"></div><div class="note">Estimate uses the standard reducing-balance EMI formula. Actual lender fees and charges may differ.</div></div></div><script>var $=function(x){return document.getElementById(x)},money=function(n){return"₹"+Math.round(n||0).toLocaleString("en-IN")};function printPage(){window.print()}function calc(){var P=+$("amt").value||0,r=(+$("rate").value||0)/1200,t=+$("time").value||0,n=$("unit").value==="y"?Math.round(t*12):Math.round(t);if(n<1)return;var e=r?P*r*Math.pow(1+r,n)/(Math.pow(1+r,n)-1):P/n,T=e*n;$("emi").textContent=money(e);$("interest").textContent=money(T-P);$("total").textContent=money(T);$("sum").innerHTML="For <b>"+money(P)+"</b> over <b>"+n+" months</b>, estimated total interest is <b>"+money(T-P)+"</b>."}["amt","rate","time","unit"].forEach(function(i){$(i).oninput=calc;$(i).onchange=calc});calc();</script></body></html>
