<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>BG Remover - Manjeet Digital Hub</title>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/selfie_segmentation.js" crossorigin="anonymous"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#172033}
header{background:linear-gradient(135deg,#155eef,#6d28d9);color:#fff;padding:15px 14px;text-align:center}
header h1{font-size:21px;margin:0 0 4px}header p{font-size:12px;margin:0;opacity:.9}
.wrap{max-width:1050px;margin:auto;padding:12px}.panel{background:#fff;border:1px solid #e3e9f2;border-radius:16px;padding:12px;margin-bottom:12px;box-shadow:0 5px 16px rgba(20,35,70,.06)}
.previewPanel{position:sticky;top:0;z-index:5}.previewTitle{font-size:12px;font-weight:700;margin-bottom:8px}
.stage{min-height:250px;background:linear-gradient(45deg,#eee 25%,transparent 25%),linear-gradient(-45deg,#eee 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#eee 75%),linear-gradient(-45deg,transparent 75%,#eee 75%);background-size:20px 20px;background-position:0 0,0 10px,10px -10px,-10px 0;border-radius:12px;display:flex;align-items:center;justify-content:center;overflow:hidden}
#preview{max-width:100%;max-height:430px;display:block}.upload{display:block;border:2px dashed #a9c5ff;background:#f7faff;border-radius:14px;padding:18px;text-align:center;cursor:pointer}.upload input{position:absolute;opacity:0;width:1px;height:1px}.upload b{display:block;font-size:14px}.upload small{display:block;color:#667085;margin-top:5px}
h2{font-size:14px;margin:2px 0 10px}.row{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:10px 13px;min-height:40px;font-weight:700;font-size:12px;cursor:pointer;background:#155eef;color:#fff}.btn.alt{background:#eef4ff;color:#174ea6}.btn.dark{background:#172033}.btn:disabled{opacity:.45}
.choice{display:flex;gap:8px;flex-wrap:wrap}.choice button{border:1px solid #d8e0eb;background:#fff;border-radius:10px;padding:9px 12px;font-weight:700;font-size:12px}.choice button.active{border-color:#155eef;background:#eef4ff;color:#155eef}
.colorBox{display:flex;align-items:center;gap:8px;margin-top:10px}.colorBox input{width:48px;height:38px;border:1px solid #d8e0eb;border-radius:8px;padding:2px;background:#fff}
.range{margin-top:10px}.range label{display:flex;justify-content:space-between;font-size:12px;font-weight:700}.range input{width:100%}
.status{font-size:11px;color:#667085;margin-top:8px;min-height:15px}.note{font-size:11px;color:#667085;line-height:1.45;background:#f8fafc;border-radius:10px;padding:9px;margin-top:9px}
@media(min-width:760px){.layout{display:grid;grid-template-columns:1.1fr .9fr;gap:12px}.previewPanel{position:static}.stage{min-height:500px}}
</style>
</head>
<body>
<header><h1>BG Remover</h1><p>Manjeet Digital Hub</p></header>
<div class="wrap">
<div class="layout">
<div>
  <div class="panel previewPanel">
    <div class="previewTitle">Live Preview</div>
    <div class="stage"><canvas id="preview"></canvas></div>
    <div class="status" id="status">Choose a photo to start.</div>
  </div>
</div>
<div>
  <div class="panel">
    <h2>1. Upload Photo</h2>
    <label class="upload"><input id="file" type="file" accept="image/*"><b>Choose Photo</b><small>JPG, JPEG or PNG</small></label>
    <div class="row" style="margin-top:10px">
      <button class="btn" id="removeBtn" disabled>Remove Background</button>
      <button class="btn alt" id="originalBtn" disabled>Show Original</button>
    </div>
  </div>

  <div class="panel">
    <h2>2. Background</h2>
    <div class="choice">
      <button data-bg="transparent" class="active">Transparent</button>
      <button data-bg="white">White</button>
      <button data-bg="color">Custom Color</button>
    </div>
    <div class="colorBox"><span style="font-size:12px;font-weight:700">Color</span><input id="bgColor" type="color" value="#dbeafe"></div>
    <div class="range"><label><span>Edge Softness</span><span id="softVal">2</span></label><input id="softness" type="range" min="0" max="8" value="2"></div>
  </div>

  <div class="panel">
    <h2>3. Download</h2>
    <div class="row">
      <button class="btn dark" id="pngBtn" disabled>Download PNG</button>
      <button class="btn dark" id="jpgBtn" disabled>Download JPG</button>
    </div>
    <div class="note">Transparent background ke liye PNG use karein. JPG download me transparent area white ho jayega. Processing browser me hoti hai.</div>
  </div>

  <div class="panel">
    <button class="btn alt" id="resetBtn">Reset</button>
  </div>
</div>
</div>
</div>

<script>
(function(){
var file=document.getElementById('file'), preview=document.getElementById('preview'), ctx=preview.getContext('2d');
var removeBtn=document.getElementById('removeBtn'), originalBtn=document.getElementById('originalBtn');
var pngBtn=document.getElementById('pngBtn'), jpgBtn=document.getElementById('jpgBtn'), resetBtn=document.getElementById('resetBtn');
var status=document.getElementById('status'), bgColor=document.getElementById('bgColor'), softness=document.getElementById('softness'), softVal=document.getElementById('softVal');
var original=null, maskCanvas=null, removed=false, bgMode='transparent', segmenter=null, busy=false;

function setStatus(t){status.textContent=t}
function fitCanvas(w,h){
  var max=1600, s=Math.min(1,max/Math.max(w,h));
  preview.width=Math.round(w*s); preview.height=Math.round(h*s);
}
function drawOriginal(){
  if(!original)return;
  ctx.clearRect(0,0,preview.width,preview.height);
  ctx.drawImage(original,0,0,preview.width,preview.height);
  removed=false; setStatus('Original photo');
}
function makeSegmenter(){
  if(segmenter)return segmenter;
  if(typeof SelfieSegmentation==='undefined')return null;
  segmenter=new SelfieSegmentation({locateFile:function(f){return 'https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/'+f;}});
  segmenter.setOptions({modelSelection:1});
  segmenter.onResults(function(res){
    maskCanvas=document.createElement('canvas'); maskCanvas.width=preview.width; maskCanvas.height=preview.height;
    var m=maskCanvas.getContext('2d');
    m.clearRect(0,0,maskCanvas.width,maskCanvas.height);
    m.drawImage(res.segmentationMask,0,0,maskCanvas.width,maskCanvas.height);
    renderRemoved();
    busy=false; removeBtn.disabled=false;
    pngBtn.disabled=false; jpgBtn.disabled=false;
    setStatus('Background removed. Background style choose karke download karein.');
  });
  return segmenter;
}
function renderRemoved(){
  if(!original||!maskCanvas)return;
  var temp=document.createElement('canvas'); temp.width=preview.width; temp.height=preview.height;
  var t=temp.getContext('2d');
  t.drawImage(original,0,0,temp.width,temp.height);
  t.globalCompositeOperation='destination-in';
  if(Number(softness.value)>0){t.filter='blur('+Number(softness.value)+'px)';}
  t.drawImage(maskCanvas,0,0,temp.width,temp.height);
  t.filter='none'; t.globalCompositeOperation='source-over';

  ctx.clearRect(0,0,preview.width,preview.height);
  if(bgMode==='white'){ctx.fillStyle='#ffffff';ctx.fillRect(0,0,preview.width,preview.height);}
  if(bgMode==='color'){ctx.fillStyle=bgColor.value;ctx.fillRect(0,0,preview.width,preview.height);}
  ctx.drawImage(temp,0,0);
  removed=true;
}
file.onchange=function(){
  var f=this.files&&this.files[0]; if(!f)return;
  var reader=new FileReader();
  reader.onload=function(e){
    var im=new Image();
    im.onload=function(){
      original=im; maskCanvas=null; fitCanvas(im.naturalWidth,im.naturalHeight); drawOriginal();
      removeBtn.disabled=false; originalBtn.disabled=false; pngBtn.disabled=true; jpgBtn.disabled=true;
      setStatus('Photo loaded. Remove Background press karein.');
    };
    im.src=e.target.result;
  };
  reader.readAsDataURL(f);
};
removeBtn.onclick=async function(){
  if(!original||busy)return;
  var s=makeSegmenter();
  if(!s){alert('Background remover could not load. Internet connection check karein.');return;}
  busy=true; removeBtn.disabled=true; setStatus('Removing background...');
  try{await s.send({image:original});}
  catch(e){busy=false;removeBtn.disabled=false;setStatus('Could not process photo. Please try again.');}
};
originalBtn.onclick=drawOriginal;
document.querySelectorAll('[data-bg]').forEach(function(b){
  b.onclick=function(){
    document.querySelectorAll('[data-bg]').forEach(function(x){x.classList.remove('active')});
    this.classList.add('active'); bgMode=this.getAttribute('data-bg');
    if(maskCanvas)renderRemoved();
  };
});
bgColor.oninput=function(){bgMode='color';document.querySelectorAll('[data-bg]').forEach(function(x){x.classList.toggle('active',x.getAttribute('data-bg')==='color')});if(maskCanvas)renderRemoved();};
softness.oninput=function(){softVal.textContent=this.value;if(maskCanvas)renderRemoved();};

function download(type){
  if(!original)return;
  if(!removed&&maskCanvas)renderRemoved();
  var out=document.createElement('canvas');out.width=preview.width;out.height=preview.height;
  var o=out.getContext('2d');
  if(type==='image/jpeg' && bgMode==='transparent'){o.fillStyle='#fff';o.fillRect(0,0,out.width,out.height);}
  o.drawImage(preview,0,0);
  var a=document.createElement('a');a.download=type==='image/png'?'manjeet-bg-removed.png':'manjeet-bg-removed.jpg';
  a.href=out.toDataURL(type,type==='image/jpeg'?.94:1);document.body.appendChild(a);a.click();a.remove();
}
pngBtn.onclick=function(){download('image/png')};jpgBtn.onclick=function(){download('image/jpeg')};
resetBtn.onclick=function(){
  original=null;maskCanvas=null;removed=false;file.value='';preview.width=300;preview.height=220;ctx.clearRect(0,0,preview.width,preview.height);
  removeBtn.disabled=true;originalBtn.disabled=true;pngBtn.disabled=true;jpgBtn.disabled=true;setStatus('Choose a photo to start.');
};
preview.width=300;preview.height=220;
})();
</script>
</body>
</html>
