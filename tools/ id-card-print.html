<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Single ID Card Print - Manjeet Digital Hub</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#edf2f8;color:#26364b}
.top{background:#fff;border-bottom:1px solid #dce4ee;padding:10px;position:sticky;top:0;z-index:30}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;max-width:650px;margin:auto;background:#edf3fa;padding:5px;border-radius:13px}
.tab{border:0;background:transparent;padding:10px 4px;border-radius:9px;font-weight:700;color:#607089}.tab.active{background:#2563eb;color:#fff}
.app{max-width:980px;margin:auto;padding:10px}
.workspaceWrap{background:#dfe7f1;padding:10px;border-radius:14px}
.workspace{position:relative;background:#fff;margin:auto;box-shadow:0 1px 4px #aab7c7;overflow:hidden;width:min(100%,720px);aspect-ratio:210/297}
.card{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#f8fafc;border:1px dashed #94a3b8;overflow:hidden;touch-action:none;box-shadow:0 1px 3px #cbd5e1}
.card img{width:100%;height:100%;display:block;object-fit:cover;pointer-events:none}
.empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;color:#94a3b8;font-size:12px;padding:10px}
.badge{position:absolute;left:5px;top:5px;background:#2563eb;color:white;border-radius:6px;padding:3px 6px;font-size:9px;z-index:2}
.controls{margin-top:10px;background:#fff;border-radius:14px;padding:12px;box-shadow:0 1px 3px #d3dce7}
.row{display:flex;gap:7px;flex-wrap:wrap}.btn{border:1px solid #d6e0ec;background:#f8fafc;color:#334155;border-radius:10px;padding:10px 12px;font-weight:700;cursor:pointer;flex:1;min-width:90px}
.btn.primary{background:#2563eb;color:#fff;border-color:#2563eb}.btn.red{color:#dc2626}.btn.active{background:#eaf2ff;border-color:#2563eb;color:#1d4ed8}
input[type=file]{display:none}.upload{display:flex;gap:8px;margin-bottom:10px}.upload label{flex:1;text-align:center}
.switchrow{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid #edf1f5;margin-top:10px;font-weight:700}
.switch{position:relative;width:48px;height:27px;background:#dbe2eb;border-radius:20px;cursor:pointer}.switch:after{content:"";position:absolute;width:21px;height:21px;background:white;border-radius:50%;left:3px;top:3px;box-shadow:0 1px 3px #999;transition:.2s}.switch.on{background:#2563eb}.switch.on:after{left:24px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:9px}.field label{font-size:11px;font-weight:700;color:#64748b;display:block;margin-bottom:4px}.field select,.field input{width:100%;padding:9px;border:1px solid #dbe3ee;border-radius:9px;background:#fff}
.range{margin-top:9px}.range input{width:100%}
.bottom{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.big{padding:12px 5px;border:0;border-radius:12px;font-weight:800;background:#fff;box-shadow:0 2px 5px #ccd5df;color:#2563eb}.big.pdf{color:#dc2626}.big.print{background:#2563eb;color:#fff}
.note{text-align:center;font-size:11px;color:#7b899d;margin:10px 0 2px}.status{text-align:center;font-size:11px;color:#64748b;margin-top:7px}
@media(min-width:760px){.app{display:grid;grid-template-columns:1.25fr .75fr;gap:12px;align-items:start}.workspaceWrap{position:sticky;top:70px}.controls{margin-top:0}}
@media(max-width:759px){.app{padding:7px}.workspaceWrap{padding:7px}.workspace{max-height:52vh}.controls{padding:9px}.top{padding:7px}.btn{padding:9px 7px}.grid{grid-template-columns:1fr 1fr}}
.cropModal{display:none;position:fixed;inset:0;background:rgba(15,23,42,.82);z-index:100;padding:12px}.cropModal.show{display:flex;align-items:center;justify-content:center}.cropBox{width:min(94vw,760px);background:#fff;border-radius:14px;padding:10px}.cropStage{height:min(62vh,520px);background:#111827;overflow:hidden;border-radius:10px}.cropStage img{display:block;max-width:100%}.cropActions{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:9px}@media print{body{background:#fff}.top,.controls{display:none!important}.app,.workspaceWrap{padding:0;margin:0;display:block;background:#fff}.workspace{box-shadow:none;width:210mm;height:297mm;max-height:none}}
</style>
</head>
<body>
<div class="top"><div class="tabs">
<button class="tab active" data-mode="id">ID</button><button class="tab" data-mode="custom">Custom</button><button class="tab" data-mode="a4">A4</button><button class="tab" data-mode="pvc">PVC</button>
</div></div>
<div class="app">
<div class="workspaceWrap"><div id="workspace" class="workspace">
<div id="frontCard" class="card"><span class="badge">FRONT</span><div class="empty">Upload Front</div></div>
<div id="backCard" class="card" style="display:none"><span class="badge">BACK</span><div class="empty">Upload Back</div></div>
</div><div id="status" class="status">A4 Page • ID Card 85.6 × 54 mm</div></div>

<div class="controls">
<div class="upload">
<label class="btn active">📷 FRONT<input id="frontInput" type="file" accept="image/*"></label>
<label class="btn">🔄 BACK<input id="backInput" type="file" accept="image/*"></label>
</div>
<div class="switchrow"><span>Single Side Mode</span><div id="singleSwitch" class="switch"></div></div>

<div class="grid">
<div class="field"><label>Card Orientation</label><select id="orientation"><option value="landscape">Landscape</option><option value="portrait">Portrait</option></select></div>
<div class="field"><label>Image Fit</label><select id="fit"><option value="cover">Crop / Fill</option><option value="contain">Fit Full Image</option></select></div>
<div class="field customOnly" style="display:none"><label>Width (mm)</label><input id="customW" type="number" value="85.6" min="10" max="200" step=".1"></div>
<div class="field customOnly" style="display:none"><label>Height (mm)</label><input id="customH" type="number" value="54" min="10" max="280" step=".1"></div>
</div>

<div class="range"><label style="font-size:11px;font-weight:700">Image Zoom <span id="zoomVal">100</span>%</label><input id="zoom" type="range" min="100" max="250" value="100"></div>
<div class="row" style="margin-top:8px"><button id="rotateLeft" class="btn">↶ Rotate</button><button id="rotateRight" class="btn">↷ Rotate</button><button id="autoCropBtn" class="btn">✂ Auto Crop</button><button id="recropBtn" class="btn">▣ Re-Crop</button></div><div class="row" style="margin-top:8px"><button id="centerBtn" class="btn">Center</button><button id="swapBtn" class="btn">Front ↔ Back</button><button id="resetBtn" class="btn red">Reset</button></div>
<div class="bottom"><button id="cardBtn" class="big">⬇ CARD</button><button id="pdfBtn" class="big pdf">📄 PDF</button><button id="printBtn" class="big print">🖨 PRINT</button></div>
<div class="note">Front & Back • Exact-size card • A4 print-ready export</div>
</div></div>

<div id="cropModal" class="cropModal"><div class="cropBox"><div class="cropStage"><img id="cropImage" alt="Crop"></div><div class="cropActions"><button id="cropCancel" class="btn">Cancel</button><button id="cropFree" class="btn">Free Crop</button><button id="cropApply" class="btn primary">Apply Crop</button></div><div class="note">Drag corners/edges freely. Move and zoom the image as needed.</div></div></div>
<script>
(function(){
"use strict";
var mode="id",single=false,frontSrc="",backSrc="",activeSide="front",drag=null,cropper=null;
var ws=document.getElementById("workspace"),front=document.getElementById("frontCard"),back=document.getElementById("backCard");
var orient=document.getElementById("orientation"),fit=document.getElementById("fit"),zoom=document.getElementById("zoom");
var customW=document.getElementById("customW"),customH=document.getElementById("customH"),status=document.getElementById("status");
var pos={front:{x:50,y:42},back:{x:50,y:58}}, zooms={front:100,back:100};

function mmScale(){return ws.clientWidth/210}
function sizeMM(){
 if(mode==="a4") return {w:190,h:130};
 if(mode==="custom") return {w:+customW.value||85.6,h:+customH.value||54};
 var s={w:85.6,h:54}; if(orient.value==="portrait")s={w:54,h:85.6}; return s;
}
function setImg(card,src){
 card.innerHTML='<span class="badge">'+(card===front?'FRONT':'BACK')+'</span>'+(src?'<img src="'+src+'">':'<div class="empty">Upload '+(card===front?'Front':'Back')+'</div>');
}
function apply(){
 var s=sizeMM(),sc=mmScale(),cw=Math.min(s.w*sc,ws.clientWidth*.94),ch=cw*s.h/s.w;
 if(ch>ws.clientHeight*.9){ch=ws.clientHeight*.9;cw=ch*s.w/s.h}
 [front,back].forEach(function(c,i){
   var side=i===0?"front":"back"; c.style.width=cw+"px";c.style.height=ch+"px";c.style.left=pos[side].x+"%";c.style.top=pos[side].y+"%";
   var im=c.querySelector("img");if(im){im.style.objectFit=fit.value;im.style.transform="scale("+(zooms[side]/100)+")";}
 });
 back.style.display=(!single&&backSrc)?"block":"none";
 status.textContent="A4 Page • "+(mode==="custom"?"Custom":mode.toUpperCase())+" "+s.w+" × "+s.h+" mm";
}
function loadFile(input,side){
 var f=input.files&&input.files[0];if(!f)return;var r=new FileReader();r.onload=function(e){
  if(side==="front"){frontSrc=e.target.result;setImg(front,frontSrc)}else{backSrc=e.target.result;setImg(back,backSrc)}
  activeSide=side;zoom.value=zooms[side];document.getElementById("zoomVal").textContent=zooms[side];apply();
 };r.readAsDataURL(f);
}
document.getElementById("frontInput").onchange=function(){loadFile(this,"front")};
document.getElementById("backInput").onchange=function(){loadFile(this,"back")};
document.querySelectorAll(".tab").forEach(function(b){b.onclick=function(){document.querySelectorAll(".tab").forEach(function(x){x.classList.remove("active")});this.classList.add("active");mode=this.dataset.mode;document.querySelectorAll(".customOnly").forEach(function(x){x.style.display=mode==="custom"?"block":"none"});apply()}});
document.getElementById("singleSwitch").onclick=function(){single=!single;this.classList.toggle("on",single);apply()};
orient.onchange=apply;fit.onchange=apply;customW.oninput=apply;customH.oninput=apply;
zoom.oninput=function(){zooms[activeSide]=+this.value;document.getElementById("zoomVal").textContent=this.value;apply()};

function currentSrc(){return activeSide==="front"?frontSrc:backSrc}
function setCurrentSrc(v){if(activeSide==="front"){frontSrc=v;setImg(front,v)}else{backSrc=v;setImg(back,v)}apply()}
function rotateCurrent(deg){
 var src=currentSrc();if(!src)return alert("Please upload a card first.");
 var im=new Image();im.onload=function(){
  var c=document.createElement("canvas"),ctx=c.getContext("2d"),swap=Math.abs(deg)%180===90;
  c.width=swap?im.height:im.width;c.height=swap?im.width:im.height;
  ctx.translate(c.width/2,c.height/2);ctx.rotate(deg*Math.PI/180);ctx.drawImage(im,-im.width/2,-im.height/2);
  setCurrentSrc(c.toDataURL("image/jpeg",.96));
 };im.src=src;
}
document.getElementById("rotateLeft").onclick=function(){rotateCurrent(-90)};
document.getElementById("rotateRight").onclick=function(){rotateCurrent(90)};

function openCrop(autoMode){
 var src=currentSrc();if(!src)return alert("Please upload Front or Back card first.");
 if(!window.Cropper)return alert("Crop tool could not load. Please check internet connection.");
 var modal=document.getElementById("cropModal"),img=document.getElementById("cropImage");
 modal.classList.add("show");img.src=src;
 setTimeout(function(){
  if(cropper)cropper.destroy();
  var z=sizeMM();
  cropper=new Cropper(img,{
   viewMode:1,dragMode:"move",autoCropArea:autoMode?.94:.82,
   aspectRatio:autoMode?(z.w/z.h):NaN,
   cropBoxMovable:true,cropBoxResizable:true,movable:true,zoomable:true,
   rotatable:true,scalable:true,responsive:true
  });
 },80);
}
document.getElementById("autoCropBtn").onclick=function(){openCrop(true)};
document.getElementById("recropBtn").onclick=function(){openCrop(false)};
document.getElementById("cropFree").onclick=function(){if(cropper)cropper.setAspectRatio(NaN)};
document.getElementById("cropCancel").onclick=function(){
 if(cropper){cropper.destroy();cropper=null}
 document.getElementById("cropModal").classList.remove("show");
};
document.getElementById("cropApply").onclick=function(){
 if(!cropper)return;
 var c=cropper.getCroppedCanvas({maxWidth:2400,maxHeight:2400,imageSmoothingEnabled:true,imageSmoothingQuality:"high"});
 if(!c)return;
 setCurrentSrc(c.toDataURL("image/jpeg",.96));
 cropper.destroy();cropper=null;
 document.getElementById("cropModal").classList.remove("show");
};
document.getElementById("centerBtn").onclick=function(){pos[activeSide]={x:50,y:activeSide==="front"?42:58};apply()};
document.getElementById("swapBtn").onclick=function(){var t=frontSrc;frontSrc=backSrc;backSrc=t;setImg(front,frontSrc);setImg(back,backSrc);apply()};
document.getElementById("resetBtn").onclick=function(){frontSrc=backSrc="";setImg(front,"");setImg(back,"");pos={front:{x:50,y:42},back:{x:50,y:58}};zooms={front:100,back:100};zoom.value=100;document.getElementById("zoomVal").textContent=100;apply()};

function pointerStart(e,side){
 activeSide=side;zoom.value=zooms[side];document.getElementById("zoomVal").textContent=zooms[side];
 var p=e.touches?e.touches[0]:e;drag={side:side,x:p.clientX,y:p.clientY,startX:pos[side].x,startY:pos[side].y};e.preventDefault();
}
front.addEventListener("mousedown",function(e){pointerStart(e,"front")});back.addEventListener("mousedown",function(e){pointerStart(e,"back")});
front.addEventListener("touchstart",function(e){pointerStart(e,"front")},{passive:false});back.addEventListener("touchstart",function(e){pointerStart(e,"back")},{passive:false});
function move(e){if(!drag)return;var p=e.touches?e.touches[0]:e;pos[drag.side].x=drag.startX+(p.clientX-drag.x)/ws.clientWidth*100;pos[drag.side].y=drag.startY+(p.clientY-drag.y)/ws.clientHeight*100;apply();e.preventDefault()}
document.addEventListener("mousemove",move);document.addEventListener("touchmove",move,{passive:false});document.addEventListener("mouseup",function(){drag=null});document.addEventListener("touchend",function(){drag=null});

function makeCardCanvas(src){
 return new Promise(function(resolve,reject){if(!src)return reject();var im=new Image();im.onload=function(){var s=sizeMM(),dpi=300,W=Math.round(s.w/25.4*dpi),H=Math.round(s.h/25.4*dpi),c=document.createElement("canvas");c.width=W;c.height=H;var ctx=c.getContext("2d");ctx.fillStyle="#fff";ctx.fillRect(0,0,W,H);
 var ir=im.width/im.height,tr=W/H,sw=im.width,sh=im.height,sx=0,sy=0;
 if(fit.value==="cover"){if(ir>tr){sw=im.height*tr;sx=(im.width-sw)/2}else{sh=im.width/tr;sy=(im.height-sh)/2}ctx.drawImage(im,sx,sy,sw,sh,0,0,W,H)}
 else{var k=Math.min(W/im.width,H/im.height),dw=im.width*k,dh=im.height*k;ctx.drawImage(im,(W-dw)/2,(H-dh)/2,dw,dh)}
 resolve(c)};im.onerror=reject;im.src=src;});
}
function download(data,name){var a=document.createElement("a");a.href=data;a.download=name;document.body.appendChild(a);a.click();a.remove()}
document.getElementById("cardBtn").onclick=async function(){if(!frontSrc)return alert("Please upload Front card first.");var c=await makeCardCanvas(activeSide==="back"&&backSrc?backSrc:frontSrc);download(c.toDataURL("image/jpeg",.95),"manjeet-id-card-"+activeSide+".jpg")};
document.getElementById("pdfBtn").onclick=async function(){if(!frontSrc)return alert("Please upload Front card first.");if(!window.jspdf)return alert("PDF library not loaded.");var jsPDF=window.jspdf.jsPDF,pdf=new jsPDF({orientation:"portrait",unit:"mm",format:"a4"}),s=sizeMM(),fc=await makeCardCanvas(frontSrc);pdf.addImage(fc.toDataURL("image/jpeg",.94),"JPEG",15,15,s.w,s.h);
 if(!single&&backSrc){var bc=await makeCardCanvas(backSrc);pdf.addImage(bc.toDataURL("image/jpeg",.94),"JPEG",15,25+s.h,s.w,s.h)}
 pdf.save("manjeet-id-card-print.pdf")};
document.getElementById("printBtn").onclick=function(){if(!frontSrc)return alert("Please upload Front card first.");window.print()};
window.addEventListener("resize",apply);setTimeout(apply,100);
})();
</script>
</body></html>
